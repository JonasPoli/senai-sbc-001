<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 581" width="1024" height="581">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 32px; font-weight: 700; fill: #152d3b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #788896; }
      .code { font-family: "SF Mono", Menlo, Consolas, Monaco, "Courier New", monospace; font-size: 20px; fill: #2f8277; }
      .th { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #ffffff; }
      .td { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; fill: #152d3b; }
      .td-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #152d3b; }
      .td-code { font-family: "SF Mono", Menlo, Consolas, Monaco, monospace; font-size: 15px; font-weight: 600; fill: #2f8277; }
      .footer { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #a5b0b5; }
    </style>
  </defs>

  <!-- Fundo Original Exato (#fafaf7) -->
  <rect width="1024" height="581" fill="#fafaf7" />

  <!-- Cabeçalho -->
  <text x="45" y="70" class="title">Regra Prolog e unificação</text>
  <text x="45" y="112" class="subtitle">Etapas 6 e 7 · 19:00–21:00</text>

  <!-- Bloco de Código Prolog (Cor exata: #2f8277) -->
  <text x="45" y="185" class="code">acesso(X, producao) :-</text>
  <text x="75" y="215" class="code">funcionario(X),</text>
  <text x="75" y="245" class="code">credencial_valida(X),</text>
  <text x="75" y="275" class="code">treinamento_concluido(X),</text>
  <text x="75" y="305" class="code">autorizacao_especial(X).</text>

  <!-- TABELA: Cabeçalho (#152d3b) -->
  <rect x="45" y="375" width="934" height="34" fill="#152d3b" />
  <text x="58" y="398" class="th">Regra de unificação</text>
  <text x="495" y="398" class="th">Exemplo prático neste caso</text>

  <!-- TABELA: Linha 1 (Estruturas compatíveis) - Fundo branco/off-white -->
  <rect x="45" y="409" width="934" height="34" fill="#fafaf7" />
  <text x="58" y="432" class="td-bold">1. Estruturas compatíveis</text>
  <text x="495" y="432" class="td">Mesmo predicado e aridade (<tspan class="td-code">acesso/2</tspan> casa com <tspan class="td-code">acesso/2</tspan>)</text>

  <!-- TABELA: Linha 2 (Constantes iguais) - Fundo verde suave (#e0e9e8) -->
  <rect x="45" y="443" width="934" height="34" fill="#e0e9e8" />
  <text x="58" y="466" class="td-bold">2. Constantes iguais</text>
  <text x="495" y="466" class="td"><tspan class="td-code">producao</tspan> unifica com <tspan class="td-code">producao</tspan> (átomos idênticos)</text>

  <!-- TABELA: Linha 3 (Variável livre e termo) - Fundo branco/off-white -->
  <rect x="45" y="477" width="934" height="34" fill="#fafaf7" />
  <text x="58" y="500" class="td-bold">3. Variável livre e termo</text>
  <text x="495" y="500" class="td"><tspan class="td-code">X</tspan> unifica com <tspan class="td-code">ana</tspan> (instancia <tspan class="td-code">X = ana</tspan> em todo o corpo)</text>

  <!-- Linha divisória do rodapé (#e6eced) -->
  <line x1="45" y1="528" x2="979" y2="528" stroke="#e6eced" stroke-width="1.5" />

  <!-- Rodapé -->
  <text x="45" y="546" class="footer">PROLOG_PARTE_1.pdf, p. 14–16 · PROLOG_PARTE_2.pdf, p. 3–10</text>
  <text x="880" y="546" class="footer">11   Jonas   2:00</text>
